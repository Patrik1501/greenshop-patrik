<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/styles.css">
    
</head>


<body>

<div class="form">

    <form class="registration-form">
        <span class="Login">Login</span>
        <span class="I">I</span>
        <span class="Register">Register</span>
    </form>
    
    <form class="enter-your-email-text">
        <span class="email-text">Enter your email and password to register.</span>
    </form>
    
    <form class="inputs-registration">
        <input type="text" class="username" placeholder="Username" required>
        <input type="email" class="email" placeholder="Enter your email address" required>
        <input type="password" class="password" placeholder="Password" required>
        <input type="password" class="confirm-password" placeholder="Confirm Password"required>
        <button type="submit" class="submit">Register</button>
    </form>
    
    <form class="or-register-with">
        <div class="line"></div>
        <span class="or-register-with-text">Or register with</span>
        <div class="line2"></div>
    </form>
    
    <form class="social-media-login">
        <a href="https://accounts.google.com/signin" class="login-with-google-btn">
            <img src="./img/google%201.svg" alt="google" width="20" height="20">
            <span>Continue with Google</span>
        </a>
        <a href="https://www.facebook.com/login" class="login-with-facebook-btn">
            <img src="./img/facebook%201.svg" alt="facebook" width="20" height="20">
            <span>Continue with Facebook</span>
        </a>
    </form>
    
    <form class="line-footer"></form>
    
    
</div>


</body>

</html>
